# @package _global_
algorithm: dqn
hp_config:
  buffer_prio_sampling: false
  buffer_alpha: 0.6
  buffer_beta: 0.4
  buffer_epsilon: 1e-6
  buffer_batch_size: 32
  buffer_size: 10000
  initial_epsilon: 1.0
  target_epsilon: 0.01
  exploration_fraction: 0.1
  gamma: 0.99
  gradient_steps: 1
  learning_rate: 0.00025
  learning_starts: 100000
  normalize_observations: false
  train_freq: 4
  use_target_network: true
  target_update_interval: 10000
  tau: 1.0
nas_config:
  activation: relu
  hidden_size: 512
