autorl:
  algorithm: dqn
  checkpoint: []
  checkpoint_dir: /tmp
  checkpoint_name: default_checkpoint
  cnn_policy: false
  env_framework: mdp
  n_envs: 1
  n_eval_episodes: 128
  n_eval_steps: 50
  n_total_timesteps: 100000
  nas_config:
    activation: relu
    hidden_size: 128
  objectives:
  - reward_mean
  optimize_objectives: upper
  seed: 42
  state_features: []
hydra:
  job:
    chdir: true
  run:
    dir: results/Grid_Search_1
  sweep:
    dir: results/Grid_Search_1
jax_enable_x64: true
load_checkpoint: ''
