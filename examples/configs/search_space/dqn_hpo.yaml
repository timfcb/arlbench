seed: 0
hyperparameters:
  hp_config.buffer_alpha:
    type: uniform_float
    upper: 1.0
    lower: 0.5
    default: 0.9
    log: false
  hp_config.buffer_beta:
    type: uniform_float
    upper: 1.0
    lower: 0.5
    default: 0.9
    log: false
  hp_config.buffer_epsilon:
    type: uniform_float
    upper: 1e-1
    lower: 1e-7
    default: 1e-6
    log: true
  hp_config.buffer_prio_sampling:
    type: categorical
    choices:
      - true
      - false
    default: false
  hp_config.buffer_size:
    type: uniform_int
    upper: 20000
    lower: 100
    default: 10000
    log: false
  hp_config.learning_starts:
    type: uniform_int
    upper: 10000
    lower: 100
    default: 1000
    log: false
  hp_config.use_target_network:
    type: categorical
    choices:
      - true
      - false
    default: true
  hp_config.target_update_interval:
    type: uniform_int
    upper: 10000
    lower: 100
    default: 1000
    log: false
  hp_config.tau:
    type: uniform_float
    upper: 1.0
    lower: 0.0
    default: 1.0
    log: false
  hp_config.gradient_steps:
    type: uniform_int
    upper: 10
    lower: 1
    default: 1
    log: false
  hp_config.train_freq:
    type: uniform_int
    upper: 10
    lower: 1
    default: 1
    log: false
conditions:
  - child: hp_config.target_update_interval
    parent: hp_config.use_target_network
    value: true
    type: EQ
  - child: hp_config.tau
    parent: hp_config.use_target_network
    value: true
    type: EQ
  - child: hp_config.buffer_epsilon
    parent: hp_config.buffer_prio_sampling
    value: true
    type: EQ
  - child: hp_config.buffer_alpha
    parent: hp_config.buffer_prio_sampling
    value: true
    type: EQ
  - child: hp_config.buffer_beta
    parent: hp_config.buffer_prio_sampling
    value: true
    type: EQ
